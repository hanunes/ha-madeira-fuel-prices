changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Fixes"
      labels:
        - bug
        - fix
    - title: "🧰 Maintenance"
      labels:
        - chore
        - dependencies
        - documentation
    - title: "📝 Other Changes"
      labels:
        - "*"
